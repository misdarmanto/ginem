version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8
    container_name: ginem-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ginem_dev
      MYSQL_USER: ginem
      MYSQL_PASSWORD: ginem123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ginem-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: ginem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ginem-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: ginem-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://ginem:ginem123@db:3306/ginem_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/api:/app
      - /app/node_modules
    networks:
      - ginem-network
    command: npm run dev

  # Frontend Dashboard
  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    container_name: ginem-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://api:3000
    depends_on:
      - api
    volumes:
      - ./packages/dashboard:/app
      - /app/node_modules
    networks:
      - ginem-network
    command: npm run dev

networks:
  ginem-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
